<title>Slides Prontos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Aulas de Língua Portuguesa alinhadas à BNCC, prontas para apresentar, editar e baixar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: catálogo em grade de capas reais + visualizador de aula em tela cheia; identidade "marca-texto sobre caderno" */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#17233B; --muted:#5C6678; --line:#DCE2EA;
  --mark:#FFD25A; --mark-ink:#5A4300; --brand:#17233B; --ok:#1E8E4E; --ok-soft:#E1F3E8; --warn-soft:#F1F3F6;
  --ini:#D2601A; --fin:#0B7C7A; --med:#B02E55;
  --shadow:0 1px 2px rgba(23,35,59,.06),0 8px 24px rgba(23,35,59,.08);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#161F31; --surface-2:#1B2539; --ink:#E9EDF4; --muted:#9BA7BA; --line:#27324A;
  --mark:#FFD25A; --mark-ink:#3B2C00; --brand:#E9EDF4; --ok:#53C487; --ok-soft:#173326; --warn-soft:#1E293D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161F31; --surface-2:#1B2539; --ink:#E9EDF4; --muted:#9BA7BA; --line:#27324A;
  --mark:#FFD25A; --mark-ink:#3B2C00; --brand:#E9EDF4; --ok:#53C487; --ok-soft:#173326; --warn-soft:#1E293D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mk{background:var(--mark);color:#17233B;border-radius:8px;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;white-space:nowrap;color:var(--ink);text-decoration:none}
.logo svg{flex:none}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px}
.search svg{position:absolute;left:13px;top:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;white-space:nowrap;transition:transform .12s,background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.92}
.btn.mark{background:var(--mark);color:#2B2100;border-color:var(--mark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{height:34px;padding:0 12px;border-radius:10px;font-size:14px}
.btn.icon{width:42px;padding:0}

/* abertura */
.hero{padding-block:40px 28px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(32px,4.4vw,54px);line-height:1.04;font-weight:800}
.hero p.lead{font-size:18px;color:var(--muted);max-width:56ch;margin:16px 0 22px}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0;padding:0;list-style:none}
.facts li{display:flex;align-items:baseline;gap:8px;color:var(--muted)}
.facts b{font-family:var(--f-display);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.stack{position:relative;aspect-ratio:16/11;max-width:100%}
.stack .frame{position:absolute;width:78%;box-shadow:var(--shadow);border-radius:12px}
.stack .frame:nth-child(1){left:0;top:0;transform:rotate(-4deg)}
.stack .frame:nth-child(2){left:11%;top:14%;transform:rotate(2deg)}
.stack .frame:nth-child(3){right:0;bottom:0;transform:rotate(-1deg)}
@media (prefers-reduced-motion:no-preference){ .stack .frame{transition:transform .5s cubic-bezier(.2,.8,.2,1)} .stack:hover .frame:nth-child(1){transform:rotate(-7deg) translate(-10px,-6px)} .stack:hover .frame:nth-child(3){transform:rotate(2deg) translate(10px,8px)} }

/* moldura de slide (escala por variável) */
.frame{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#F8F9FB;max-width:100%}
.frame>.sl{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;transform:scale(var(--s,.2))}
.sl .sl-shape,.sl .sl-img,.sl .sl-text,.sl .sl-answer{position:absolute}
.sl .sl-text{display:flex;flex-direction:column;overflow:hidden}
.sl .sl-in{overflow-wrap:break-word;outline:none;min-width:0}
.sl .f-h{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif}
.sl .f-b{font-family:"Atkinson Hyperlegible",Verdana,sans-serif}
.sl .sl-answer{font:700 24px/1.2 "Atkinson Hyperlegible",sans-serif;display:flex;align-items:flex-end;padding:0 4px 4px}
.sl b{font-weight:800}
.sl-img{pointer-events:none;user-select:none}

/* filtros */
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 67px);z-index:15;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
.filters .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;height:34px;padding:0 12px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
select.sel{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:700}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

/* grade de aulas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding-block:24px 64px}
.card{display:flex;flex-direction:column;gap:10px;background:none;border:0;padding:0;text-align:left;border-radius:14px}
.card .frame{box-shadow:var(--shadow);transition:transform .18s}
.card:hover .frame{transform:translateY(-3px)}
.card h3{font-size:16px;line-height:1.25;font-weight:700}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--warn-soft);color:var(--muted)}
.pill.ed{background:var(--mark);color:#2B2100}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.codes{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.section-h{display:flex;align-items:baseline;gap:12px;margin-top:8px}
.section-h h2{font-size:22px}

/* visualizador de aula */
.view{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.vbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.vbar .t{flex:1;min-width:200px}
.vbar .t h2{font-size:20px;line-height:1.2}
.vbar .t .sub{color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.vmain{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:20px 40px}
.stage{min-width:0}
.stage .frame{box-shadow:var(--shadow);border-radius:14px}
.stage-nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.stage-nav .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;min-width:80px;text-align:center}
.stage-nav .ty{color:var(--muted);font-size:13px}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h4{margin:0 0 8px;font-family:var(--f-display);font-size:15px}
.panel p{margin:0;color:var(--muted);font-size:14px}
.bncc-item{padding:8px 0;border-top:1px solid var(--line)}
.bncc-item:first-of-type{border-top:0}
.bncc-item b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:48px}
.thumb{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px}
.thumb .frame{border-radius:8px;box-shadow:0 0 0 1px var(--line)}
.thumb[aria-current="true"] .frame{box-shadow:0 0 0 3px var(--ink)}
.thumb span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan{margin:0;padding-left:20px;color:var(--muted);columns:2;column-gap:24px;font-size:14px}

/* edição */
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--mark);color:#2B2100;border-radius:12px;padding:8px 10px;margin-bottom:12px}
.editbar .btn{background:rgba(255,255,255,.7);border-color:transparent;color:#2B2100}
.editbar .lbl{font-weight:800;margin-right:4px}
.sl-editable .sl-in{cursor:text;border-radius:4px}
.sl-editable:hover .sl-in{box-shadow:0 0 0 3px rgba(255,210,90,.9)}
.sl-editable .sl-in:focus{box-shadow:0 0 0 4px #FFD25A;background:rgba(255,255,255,.55)}
.editing .sl-img{pointer-events:auto;cursor:pointer}
.editing .sl-img:hover{outline:4px dashed #FFD25A;outline-offset:6px}
textarea.notes{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:10px;resize:vertical}

/* menus e diálogos */
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;width:300px;max-width:calc(100vw - 32px)}
.menu-list button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px}
.menu-list button:hover{background:var(--surface-2)}
.menu-list .ext{flex:none;width:46px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.menu-list small{display:block;color:var(--muted);font-size:12.5px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,25,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.modal h3{font-size:20px;margin-bottom:12px}
.ill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:12px 0}
.ill-grid button{border:1px solid var(--line);background:#F8F9FB;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#17233B}
.ill-grid img{width:64px;height:64px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;min-width:260px;max-width:calc(100vw - 32px);box-shadow:var(--shadow);font-weight:700}
.toast .bar{height:5px;border-radius:5px;background:rgba(127,127,127,.35);margin-top:8px;overflow:hidden}
.toast .bar i{display:block;height:100%;background:var(--mark);width:0;transition:width .2s}

/* apresentação */
.present{position:fixed;inset:0;z-index:70;background:#0B0F17;display:flex;flex-direction:column}
.present .pstage{flex:1;display:grid;place-items:center;padding:16px;min-height:0}
.present .frame{width:min(100%, calc((100vh - 110px) * 16 / 9));border-radius:6px}
.present .pbar{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#E9EDF4;flex-wrap:wrap}
.present .pbar .btn{background:#1B2539;border-color:#27324A;color:#E9EDF4}
.present .pbar .btn[aria-pressed="true"]{background:#FFD25A;color:#2B2100;border-color:#FFD25A}
.present .prog{flex:1;min-width:80px;height:6px;border-radius:6px;background:#27324A;overflow:hidden}
.present .prog i{display:block;height:100%;background:#FFD25A}
.present .n{font-variant-numeric:tabular-nums;font-weight:700;min-width:70px;text-align:center}
.present .pnotes{background:#161F31;color:#E9EDF4;padding:12px max(16px,env(safe-area-inset-left,0px));max-height:28vh;overflow:auto;font-size:15px;border-top:1px solid #27324A}
.sl-opt{cursor:pointer}
.present .sl-opt:hover{box-shadow:inset 0 0 0 4px #17233B !important}
.sl-opt.right{background:#E1F3E8 !important;box-shadow:inset 0 0 0 5px #1E8E4E !important}
.sl-opt.wrong{background:#FBE4E2 !important;box-shadow:inset 0 0 0 5px #C2413B !important}
.why{position:absolute;left:330px;right:64px;top:140px;background:#17233B;color:#fff;border-radius:16px;padding:14px 20px;font:700 24px/1.3 "Atkinson Hyperlegible",sans-serif}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-block:24px 16px}
  .stack{max-width:520px}
  .vmain{grid-template-columns:1fr}
  .filters{position:static}
}
@media (max-width:560px){
  .top .wrap{flex-wrap:wrap}
  .search{order:3;flex-basis:100%}
  .top .btn .lbl-long{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
  .plan{columns:1}
  .count{margin-left:0}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

.ano-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 6px 6px}
.ano-grid .chip{width:100%;height:auto;min-height:34px;padding:6px 4px;white-space:nowrap;font-size:12.5px}
.section-h{flex-wrap:wrap}

</style>
<div id="app"></div>
<script>

  [10,'1','A','Sinais que mudam a voz: a pontuação',['EF01LP14']],

  [29,'2','O','Relato de experiência pessoal',['EF02LP14','EF02LP17']],
  [30,'2','O','Cantigas e canções',['EF02LP12','EF02LP15']],

  [37,'3','A','Dígrafos: LH, NH e CH',['EF03LP03']],
  [38,'3','A','Sílaba tônica: oxítonas, paroxítonas e proparoxítonas',['EF03LP06']],

  [45,'3','P','Textos instrucionais: receitas e manuais',['EF03LP11','EF03LP14']],

  [49,'3','P','Relatório de observação',['EF03LP25','EF03LP26']],
  [50,'3','L','A ideia principal do texto',['EF35LP03']],
  [51,'3','L','Lendo nas entrelinhas: informações implícitas',['EF35LP04']],
  [52,'3','L','Descobrindo palavras pelo contexto',['EF35LP05']],
  [53,'3','L','Histórias em quadrinhos e tirinhas',['EF15LP14']],
  [54,'3','O','Ouvir e perguntar: a conversa em sala',['EF15LP10','EF15LP11']],

  {type:'conceito', title:'O que é concordância?', text:'Concordância é a **combinação entre as palavras** da frase. Algumas palavras mudam de forma (gênero, número ou pessoa) para combinar com outras.', box:'Na norma-padrão, a concordância deixa o texto mais claro e adequado a situações formais.', ill:'quebracabeca'},

  {type:'exemplos', title:'Concordância verbal', cards:[['Eu estudo.','1ª pessoa do singular'],['Nós estudamos.','1ª pessoa do plural'],['A turma estuda.','Sujeito no singular, verbo no singular'],['Os alunos estudam.','Sujeito no plural, verbo no plural']]},

  {type:'texto', title:'Leitura: trecho de artigo', text:'Celular na escola: proibir ou ensinar?\nProibir o celular na sala de aula parece a solução mais simples, mas não é a melhor. Os estudantes vivem conectados e precisam aprender a usar a tecnologia com responsabilidade. Há quem diga que o aparelho tira a concentração; no entanto, quando o professor define regras claras, o celular pode virar ferramenta de pesquisa. Por isso, mais do que proibir, a escola deve educar para o uso consciente.', source:'Texto criado para esta aula', side:{h:'Analise', items:['Qual é a tese?','Qual contra-argumento aparece?','Que expressão introduz a conclusão?']}},

  {type:'atividade', title:'Atividade 1: relação de sentido', instr:'Indique a relação.', items:[{q:'Conforme previsto, o show começou às 20h.', r:'Conformidade'},{q:'Ora chove, ora faz sol.', r:'Alternância'},{q:'Falou tão alto que acordou o bebê.', r:'Consequência'},{q:'Não saia, pois está chovendo.', r:'Explicação'}]},

// Motor de slides: um único layout alimenta a tela, o PowerPoint e o PDF.
(function(){
const SP = window.SP = {};
const W = 1280, H = 720;
SP.W = W; SP.H = H;

const INK = '#17233B', MUTED = '#5C6678', PAPER = '#F8F9FB', LINE = '#D6DDE6', WHITE = '#FFFFFF', MARK = '#FFF1BF', MARK_INK = '#7A5A00', OK = '#1E8E4E', BAD = '#C2413B';
SP.colors = {INK, MUTED, PAPER, LINE, WHITE, MARK, OK, BAD};

const ETAPAS = {
  ini: {nome:'Anos iniciais', accent:'#D2601A', soft:'#FCE8D9', deep:'#83360A'},
  fin: {nome:'Anos finais',   accent:'#0B7C7A', soft:'#DAF0EE', deep:'#05514F'},
  med: {nome:'Ensino Médio',  accent:'#B02E55', soft:'#F7DFE7', deep:'#6E1532'}
};
SP.ETAPAS = ETAPAS;
const EIXOS = {L:'Leitura', P:'Produção de textos', O:'Oralidade', A:'Análise linguística'};
SP.EIXOS = EIXOS;

SP.etapaDe = (ano) => ano.startsWith('EM') ? 'med' : (+ano <= 5 ? 'ini' : 'fin');
SP.anoLabel = (ano) => ano.startsWith('EM') ? ano.slice(2) + 'ª série · Ensino Médio' : ano + 'º ano';
SP.anoCurto = (ano) => ano.startsWith('EM') ? ano.slice(2) + 'ª série EM' : ano + 'º ano';

SP.meta = function(item){
  const [id, ano, eixo, titulo, codes] = item;
  const et = SP.etapaDe(ano);

// ---------- texto com **negrito** ----------
SP.parse = function(text){
  return String(text ?? '').split('\n').map(par => {
    const runs = []; const parts = par.split('**');
    parts.forEach((p, i) => { if (p) runs.push({t: p, b: i % 2 === 1}); });
    return runs.length ? runs : [{t:'', b:false}];
  });
};
SP.plain = (text) => String(text ?? '').replace(/\*\*/g, '');

// quebra em linhas com uma função de medida (usada no PDF e no PowerPoint)
SP.wrap = function(paras, maxW, size, bold, measure){
  const lines = [];
  for (const runs of paras){
    let line = [], lw = 0;
    const tokens = [];
    for (const r of runs){
      r.t.split(/(\s+)/).forEach(tok => { if (tok !== '') tokens.push({t: tok, b: r.b || bold}); });
    }
    if (!tokens.length){ lines.push({segs: [], w: 0}); continue; }
    for (const tok of tokens){
      const space = /^\s+$/.test(tok.t);
      const tw = measure(tok.t, tok.b, size);
      if (!space && lw + tw > maxW && line.length){
        while (line.length && /^\s+$/.test(line[line.length-1].t)) { lw -= line[line.length-1].w; line.pop(); }
        lines.push({segs: line, w: lw}); line = []; lw = 0;
      }
      if (space && !line.length) continue;
      line.push({t: tok.t, b: tok.b, w: tw}); lw += tw;
    }
    while (line.length && /^\s+$/.test(line[line.length-1].t)) { lw -= line[line.length-1].w; line.pop(); }
    lines.push({segs: line, w: lw});
  }
  return lines;
};
SP.fit = function(el, measure){
  const paras = SP.parse(el.text);
  const lh = el.lh || 1.2;
  let size = el.size;
  const min = el.min || Math.max(9, Math.round(el.size * 0.45));
  let lines;
  while (true){
    lines = SP.wrap(paras, el.w, size, el.bold, measure);
    const tooWide = lines.some(l => l.segs.length === 1 && l.w > el.w * 1.01);
    if ((lines.length * size * lh <= el.h && !tooWide) || size <= min) break;
    size -= 1;
  }
  return {size, lines, lh};
};

// ---------- utilidades de caminho (edição) ----------
SP.getPath = (obj, path) => path.split('.').reduce((o,k) => o == null ? o : o[k], obj);
SP.setPath = (obj, path, val) => { const ks = path.split('.'); let o = obj; ks.slice(0,-1).forEach(k => { if (o[k] == null) o[k] = {}; o = o[k]; }); o[ks[ks.length-1]] = val; };

// ---------- renderização em HTML ----------
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
SP.toHTML = (t) => SP.parse(t).map(runs => runs.map(r => r.b ? `<b>${esc(r.t)}</b>` : esc(r.t)).join('')).join('<br>');
SP.fromHTML = function(el){
  // converte o conteúdo editado de volta para texto com **negrito**
  let out = '';
  const walk = (n, bold) => {
    n.childNodes.forEach(c => {
      if (c.nodeType === 3) out += bold ? `**${c.textContent}**` : c.textContent;
      else if (c.nodeName === 'BR') out += '\n';
      else if (c.nodeName === 'DIV' || c.nodeName === 'P'){ if (out && !out.endsWith('\n')) out += '\n'; walk(c, bold); }
      else walk(c, bold || c.nodeName === 'B' || c.nodeName === 'STRONG');
    });
  };
  walk(el, false);
  return out.replace(/\*\*\*\*/g,'').replace(/ /g,' ').replace(/\n+$/,'');
};

const illCache = {};
SP.illURL = (key) => illCache[key] || (illCache[key] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent((window.ILUSTRACOES||{})[key] || (window.ILUSTRACOES||{}).livro));

SP.renderHTML = function(meta, lesson, idx, opts={}){
  const els = SP.layout(meta, lesson, idx);
  const root = document.createElement('div');
  root.className = 'sl';
  for (const e of els){
    let d;
    if (e.k === 'rect' || e.k === 'ell'){
      d = document.createElement('div'); d.className = 'sl-shape';
      d.style.cssText = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;background:${e.fill};border-radius:${e.k==='ell'?'50%':e.r+'px'};${e.sw?`box-shadow:inset 0 0 0 ${e.sw}px ${e.stroke};`:''}`;
      if (e.opt !== undefined){ d.dataset.opt = e.opt; d.classList.add('sl-opt'); }
    } else if (e.k === 'line'){
      d = document.createElement('div'); d.className = 'sl-shape';
      const len = Math.hypot(e.x2-e.x1, e.y2-e.y1), ang = Math.atan2(e.y2-e.y1, e.x2-e.x1);
      d.style.cssText = `left:${e.x1}px;top:${e.y1-e.sw/2}px;width:${len}px;height:${e.sw}px;background:${e.stroke};transform-origin:0 50%;transform:rotate(${ang}rad);border-radius:${e.sw}px`;
    } else if (e.k === 'img'){
      d = document.createElement('img'); d.className = 'sl-img'; d.alt = '';
      d.src = e.src || SP.illURL(e.ill);
      d.style.cssText = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;${e.src?'object-fit:cover;border-radius:50%;':''}`;
      if (opts.editable) d.dataset.edit = 'img';
    } else if (e.k === 'answer'){
      if (!opts.answers) continue;
      d = document.createElement('div'); d.className = 'sl-answer';
      d.style.cssText = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;color:${e.color}`;
      d.textContent = e.text || '';
    } else if (e.k === 'text'){
      d = document.createElement('div'); d.className = 'sl-text ' + (e.font === 'h' ? 'f-h' : 'f-b');
      const jc = e.valign === 'm' ? 'center' : e.valign === 'b' ? 'flex-end' : 'flex-start';
      d.style.cssText = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;justify-content:${jc};text-align:${e.align==='c'?'center':e.align==='r'?'right':'left'};color:${e.color};font-weight:${e.bold?800:400};line-height:${e.lh||1.2};${e.spacing?`letter-spacing:${e.spacing}px;`:''}`;
      const inner = document.createElement('div'); inner.className = 'sl-in';
      inner.style.fontSize = e.size + 'px'; inner.dataset.size = e.size; inner.dataset.min = e.min || Math.max(9, Math.round(e.size*0.45));
      inner.innerHTML = SP.toHTML(e.text);
      if (opts.editable && e.edit){ inner.contentEditable = 'true'; inner.dataset.edit = e.edit; inner.spellcheck = true; d.classList.add('sl-editable'); }
      d.appendChild(inner);
    }
    if (d) root.appendChild(d);
  }
  return root;
};
// reduz o tamanho da fonte das caixas que transbordam (chamar depois de inserir no DOM)
SP.shrink = function(root){
  root.querySelectorAll('.sl-in').forEach(inner => {
    const box = inner.parentElement; let size = +inner.dataset.size; const min = +inner.dataset.min;
    inner.style.fontSize = size + 'px';
    let guard = 60;
    while (guard-- > 0 && size > min && (inner.scrollHeight > box.clientHeight + 1 || inner.scrollWidth > box.clientWidth + 1)){
      size -= 1; inner.style.fontSize = size + 'px';
    }
  });
};

// Exportação: PowerPoint editável (.pptx), PDF dos slides, folha de atividades (PDF) e pacotes .zip
(function(){
const SP = window.SP;
const hex = (c) => String(c||'#000000').replace('#','').toUpperCase();
const PX = 96; // px por polegada no slide de 1280x720 (13,333 x 7,5 pol)

// ---------- imagens ----------
const rasterCache = {};
function loadImage(src){
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
SP.rasterIll = async function(key, size=600){
  const k = key + '@' + size; if (rasterCache[k]) return rasterCache[k];
  const im = await loadImage(SP.illURL(key));
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(im, 0, 0, size, size);
  return (rasterCache[k] = c.toDataURL('image/png'));
};
SP.photoCircle = async function(src, size=700){
  const k = 'p:' + src.length + ':' + src.slice(-40) + size; if (rasterCache[k]) return rasterCache[k];
  const im = await loadImage(src);
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  g.beginPath(); g.arc(size/2, size/2, size/2, 0, Math.PI*2); g.clip();
  const sc = Math.max(size/im.width, size/im.height); const w = im.width*sc, h = im.height*sc;
  g.drawImage(im, (size-w)/2, (size-h)/2, w, h);
  return (rasterCache[k] = c.toDataURL('image/png'));
};
async function imgData(e){ return e.src ? SP.photoCircle(e.src) : SP.rasterIll(e.ill); }

// ---------- medida de texto para o PowerPoint ----------
const mctx = document.createElement('canvas').getContext('2d');
const PPT_FONT = {h:'Trebuchet MS', b:'Calibri'};
function pptMeasure(font){
  const fam = font === 'h' ? '"Trebuchet MS", Arial, sans-serif' : 'Calibri, Carlito, Arial, sans-serif';
  return (t, b, size) => { mctx.font = `${b?'bold ':''}${size}px ${fam}`; return mctx.measureText(t).width * 1.04; };
}

// ---------- PowerPoint ----------
SP.buildPPTX = async function(meta, lesson){
  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE';
  pptx.author = 'Slides Prontos'; pptx.company = 'Slides Prontos'; pptx.title = meta.titulo;
  pptx.subject = `Língua Portuguesa · ${meta.anoLabel} · BNCC ${meta.codes.join(', ')}`;
  for (let idx = 0; idx < lesson.slides.length; idx++){
    const s = lesson.slides[idx];
    const slide = pptx.addSlide();
    const els = SP.layout(meta, lesson, idx);
    for (const e of els){
      if (e.k === 'rect'){
        slide.addShape(e.r ? pptx.ShapeType.roundRect : pptx.ShapeType.rect, {x:e.x/PX, y:e.y/PX, w:e.w/PX, h:e.h/PX, fill:{color:hex(e.fill)}, line: e.sw ? {color:hex(e.stroke), width:e.sw*0.75} : {type:'none'}, rectRadius: e.r ? e.r/PX : undefined});
      } else if (e.k === 'ell'){
        slide.addShape(pptx.ShapeType.ellipse, {x:e.x/PX, y:e.y/PX, w:e.w/PX, h:e.h/PX, fill:{color:hex(e.fill)}, line: e.sw ? {color:hex(e.stroke), width:e.sw*0.75} : {type:'none'}});
      } else if (e.k === 'line'){
        const x = Math.min(e.x1,e.x2), y = Math.min(e.y1,e.y2), w = Math.abs(e.x2-e.x1), h = Math.abs(e.y2-e.y1);
        const flipV = (e.x2 - e.x1) * (e.y2 - e.y1) < 0;
        slide.addShape(pptx.ShapeType.line, {x:x/PX, y:y/PX, w:Math.max(w,0.5)/PX, h:Math.max(h,0)/PX, flipV, line:{color:hex(e.stroke), width:e.sw*0.75}});
      } else if (e.k === 'img'){
        const data = await imgData(e);
        slide.addImage({data: data.replace(/^data:/,''), x:e.x/PX, y:e.y/PX, w:e.w/PX, h:e.h/PX});
      } else if (e.k === 'text'){
        if (!SP.plain(e.text).trim()) continue;
        const f = SP.fit(e, pptMeasure(e.font));
        const paras = SP.parse(e.text); const runs = [];
        paras.forEach((p, pi) => p.forEach((r, ri) => runs.push({text: r.t, options: {bold: r.b || e.bold, breakLine: ri === p.length-1 && pi < paras.length-1}})));
        slide.addText(runs, {x:e.x/PX, y:e.y/PX, w:e.w/PX, h:e.h/PX, margin:0, fontFace: PPT_FONT[e.font], fontSize: Math.max(8, Math.round(f.size*0.75*10)/10), color: hex(e.color), bold: e.bold,
          align: e.align==='c'?'center':e.align==='r'?'right':'left', valign: e.valign==='m'?'middle':e.valign==='b'?'bottom':'top',
          lineSpacingMultiple: Math.max(0.8, (e.lh||1.2)/1.18), charSpacing: e.spacing ? e.spacing*0.75 : undefined, paraSpaceBefore:0, paraSpaceAfter:0, fit:'none', wrap:true});
      }
    }
    const notas = [];
    if (s.nota) notas.push(SP.plain(s.nota));
    if (s.type === 'quiz') notas.push(`Resposta: ${'ABCD'[s.c]}) ${SP.plain((s.opts||[])[s.c]||'')}. ${SP.plain(s.why||'')}`);
    if (s.type === 'atividade') notas.push('Respostas: ' + (s.items||[]).map((it,k)=>`${k+1}) ${SP.plain(it.r||'')}`).join('  '));
    if (notas.length) slide.addNotes(notas.join('\n'));
  }
  return pptx.write({outputType:'blob'});
};

// ---------- PDF ----------
let pdfFonts = null;
const winAnsiOK = {};
function sanitizer(font){
  return (t) => { let out = ''; for (const ch of String(t)){ if (winAnsiOK[ch] === undefined){ try { font.encodeText(ch); winAnsiOK[ch] = true; } catch(_) { winAnsiOK[ch] = false; } } out += winAnsiOK[ch] ? ch : (ch === '→' ? '->' : '?'); } return out; };
}
function rgbOf(c){ const n = parseInt(hex(c), 16); return PDFLib.rgb(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255); }
function rrPath(w, h, r){ r = Math.min(r, w/2, h/2); return `M ${r} 0 L ${w-r} 0 Q ${w} 0 ${w} ${r} L ${w} ${h-r} Q ${w} ${h} ${w-r} ${h} L ${r} ${h} Q 0 ${h} 0 ${h-r} L 0 ${r} Q 0 0 ${r} 0 Z`; }

async function pdfSetup(doc){
  const reg = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const bold = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  return {reg, bold, clean: sanitizer(reg)};
}
function drawTextBox(page, F, e, s, pageH){
  const measure = (t, b, size) => (b ? F.bold : F.reg).widthOfTextAtSize(F.clean(t), size);
  const f = SP.fit(e, measure);
  const lh = f.size * f.lh, total = f.lines.length * lh;
  let y0 = e.y + (e.valign === 'm' ? (e.h - total)/2 : e.valign === 'b' ? e.h - total : 0);
  for (const ln of f.lines){
    let x = e.x + (e.align === 'c' ? (e.w - ln.w)/2 : e.align === 'r' ? e.w - ln.w : 0);
    const base = y0 + (lh - f.size)/2 + f.size*0.8;
    for (const sg of ln.segs){
      const t = F.clean(sg.t);
      if (t.trim()) page.drawText(t, {x: x*s, y: pageH - base*s, size: f.size*s, font: sg.b ? F.bold : F.reg, color: rgbOf(e.color)});
      x += sg.w;
    }
    y0 += lh;
  }
}
async function drawEls(doc, page, F, els, s, pageH, ox=0, oy=0){
  for (const e0 of els){
    const e = {...e0, x:(e0.x||0)+ox, y:(e0.y||0)+oy, x1:(e0.x1||0)+ox, x2:(e0.x2||0)+ox, y1:(e0.y1||0)+oy, y2:(e0.y2||0)+oy};
    if (e.k === 'rect'){
      const o = {color: rgbOf(e.fill)}; if (e.sw){ o.borderColor = rgbOf(e.stroke); o.borderWidth = e.sw*s; }
      if (e.r) page.drawSvgPath(rrPath(e.w*s, e.h*s, e.r*s), {x: e.x*s, y: pageH - e.y*s, ...o});
      else page.drawRectangle({x: e.x*s, y: pageH - (e.y+e.h)*s, width: e.w*s, height: e.h*s, ...o});
    } else if (e.k === 'ell'){
      const o = {color: rgbOf(e.fill)}; if (e.sw){ o.borderColor = rgbOf(e.stroke); o.borderWidth = e.sw*s; }
      page.drawEllipse({x: (e.x+e.w/2)*s, y: pageH - (e.y+e.h/2)*s, xScale: e.w/2*s, yScale: e.h/2*s, ...o});
    } else if (e.k === 'line'){
      page.drawLine({start:{x:e.x1*s, y:pageH-e.y1*s}, end:{x:e.x2*s, y:pageH-e.y2*s}, thickness: e.sw*s, color: rgbOf(e.stroke)});
    } else if (e.k === 'img'){
      const im = await doc.embedPng(await imgData(e));
      page.drawImage(im, {x: e.x*s, y: pageH - (e.y+e.h)*s, width: e.w*s, height: e.h*s});
    } else if (e.k === 'text'){
      if (SP.plain(e.text).trim()) drawTextBox(page, F, e, s, pageH);
    }
  }
}
SP.buildPDF = async function(meta, lesson){
  const doc = await PDFLib.PDFDocument.create();
  doc.setTitle(meta.titulo); doc.setAuthor('Slides Prontos'); doc.setSubject(`Língua Portuguesa - ${meta.anoLabel}`);
  const F = await pdfSetup(doc);
  for (let idx = 0; idx < lesson.slides.length; idx++){
    const page = doc.addPage([960, 540]);
    await drawEls(doc, page, F, SP.layout(meta, lesson, idx), 0.75, 540);
  }
  return new Blob([await doc.save()], {type:'application/pdf'});
};

// ---------- folha de atividades (A4) ----------
SP.buildFolha = async function(meta, lesson){
  const doc = await PDFLib.PDFDocument.create();
  doc.setTitle(`${meta.titulo} - atividades`); doc.setAuthor('Slides Prontos');
  const F = await pdfSetup(doc);
  const PW = 595, PH = 842, M = 48, CW = PW - 2*M; // pontos
  let page, y;
  const newPage = () => {
    page = doc.addPage([PW, PH]); y = M;
    page.drawRectangle({x:0, y:PH-6, width:PW, height:6, color: rgbOf(meta.accent)});
    drawTextBox(page, F, {x:M, y:PH-30, w:CW, h:14, text:`Slides Prontos  ·  Língua Portuguesa  ·  ${meta.anoLabel}  ·  ${meta.titulo}`, size:8, color:'#5C6678', valign:'m', align:'l'}, 1, PH);
  };
  const tb = (t, o) => { const e = {x:M+(o.dx||0), y, w:CW-(o.dx||0), h:2000, text:t, size:o.size||11, bold:!!o.bold, color:o.color||'#17233B', lh:o.lh||1.35, valign:'t', align:o.align||'l', min:o.size||11};
    const f = SP.fit(e, (tt,b,sz) => (b?F.bold:F.reg).widthOfTextAtSize(F.clean(tt), sz));
    const hgt = f.lines.length * f.size * f.lh; return {e:{...e, h:hgt+2}, hgt}; };
  const ensure = (need) => { if (y + need > PH - M) newPage(); };
  const write = (t, o={}) => { const {e, hgt} = tb(t, o); ensure(hgt + (o.after||6)); e.y = y; drawTextBox(page, F, e, 1, PH); y += hgt + (o.after||6); };
  const lines = (n, dx=0) => { for (let i=0;i<n;i++){ ensure(24); y += 20; page.drawLine({start:{x:M+dx, y:PH-y}, end:{x:PW-M, y:PH-y}, thickness:0.6, color: rgbOf('#AEB8C6')}); } y += 10; };
  const heading = (t) => { ensure(60); y += 8; page.drawRectangle({x:M, y:PH-y-22, width:CW, height:22, color: rgbOf(meta.soft)}); drawTextBox(page, F, {x:M+8, y:PH-(PH-y)-0, w:CW-16, h:22, text:t, size:12, bold:true, color:meta.deep, valign:'m'}, 1, PH); y += 32; };

  newPage();
  y = 36;
  page.drawRectangle({x:M, y:PH-y-96, width:CW, height:96, color: rgbOf(meta.accent)});
  drawTextBox(page, F, {x:M+18, y:y+14, w:CW-36, h:16, text:`FOLHA DE ATIVIDADES  ·  ${meta.anoCurto.toUpperCase()}`, size:9, bold:true, color:'#FFFFFF'}, 1, PH);
  drawTextBox(page, F, {x:M+18, y:y+32, w:CW-36, h:30, text:meta.titulo, size:20, bold:true, color:'#FFFFFF', valign:'m', min:12}, 1, PH);
  drawTextBox(page, F, {x:M+18, y:y+66, w:CW-36, h:20, text:`Habilidades BNCC: ${meta.codes.join(', ')}`, size:9, color:'#FFFFFF', valign:'m'}, 1, PH);
  y += 116;
  write('Nome: ________________________________________   Turma: ________   Data: ____/____/______', {size:10.5, after:14});

  let na = 0, nq = 0;
  for (const s of lesson.slides){
    if (s.type === 'atividade'){
      na++; heading(SP.plain(s.title || `Atividade ${na}`));
      write(SP.plain(s.instr||''), {size:10.5, color:'#5C6678', after:8});
      (s.items||[]).forEach((it,k) => { write(`${k+1})  ${SP.plain(it.q)}`, {size:11.5, after:2}); lines(it.q.length > 40 || (it.r||'').length > 30 ? 2 : 1, 16); });
    }
  }
  const quizzes = lesson.slides.filter(s => s.type === 'quiz');
  if (quizzes.length){
    heading('Teste seus conhecimentos');
    write('Marque um X na alternativa correta.', {size:10.5, color:'#5C6678', after:8});
    quizzes.forEach(s => { nq++; ensure(40 + (s.opts||[]).length*20); write(`${nq})  ${SP.plain(s.q)}`, {size:11.5, bold:true, after:4}); (s.opts||[]).forEach((o,k) => write(`(   )  ${'abcd'[k]}) ${SP.plain(o)}`, {size:11, dx:16, after:3})); y += 8; });
  }
  const mapa = lesson.slides.find(s => s.type === 'mapa');
  if (mapa){
    heading('Mapa mental para completar');
    write('Escreva, em cada caixa, uma explicação ou um exemplo.', {size:10.5, color:'#5C6678', after:8});
    ensure(250);
    const top = y, cx = PW/2, cy = top + 115;
    const nodes = (mapa.nodes||[]).slice(0,6); const bw = 150, bh = 62;
    const pos = nodes.map((_,k) => { const col = k < Math.ceil(nodes.length/2) ? 0 : 1; const row = col === 0 ? k : k - Math.ceil(nodes.length/2); const rowsInCol = col === 0 ? Math.ceil(nodes.length/2) : Math.floor(nodes.length/2); const gy = 230/Math.max(1,rowsInCol); return [col === 0 ? M : PW - M - bw, top + row*gy + (gy-bh)/2]; });

  view.innerHTML = '';

  V.idx = Math.min(V.idx, l.slides.length - 1);
  const bar = h('div', {class:'vbar'}, h('div', {class:'wrap'},
    h('button', {class:'btn icon', onclick:closeView, 'aria-label':'Voltar ao catálogo', title:'Voltar ao catálogo'}, icon('left')),
    h('div', {class:'t'}, h('h2', {}, m.titulo), h('div', {class:'sub'}, `${m.anoLabel} · ${m.eixoNome} · ${m.codes.join(', ')}`)),
    ready ? h('div', {class:'acts'},
      h('button', {class:'btn primary', onclick:()=>present(id, V.idx)}, icon('play'), 'Apresentar'),
      h('button', {class:'btn', 'aria-pressed':String(V.editing), onclick:()=>{V.editing = !V.editing; renderView();}}, icon('edit'), V.editing ? 'Concluir edição' : 'Editar'),
      downloadMenu(id)
    ) : h('span', {class:'pill wait'}, `Em produção · lote ${LOTE[id]}`)
  ));
  view.append(bar);

  const main = h('div', {class:'wrap vmain'});
  const stage = h('div', {class:'stage' + (V.editing ? ' editing' : '')});
  if (V.editing && ready) stage.append(editBar(id, l));
  const big = frame(m, l, V.idx, {editable: V.editing && ready});
  stage.append(big);
  if (V.editing && ready) wireEditing(big, id);
  const s = l.slides[V.idx];
  stage.append(h('div', {class:'stage-nav'},
    h('button', {class:'btn icon', 'aria-label':'Slide anterior', disabled: V.idx === 0, onclick:()=>{V.idx--; renderView();}}, icon('left')),
    h('span', {class:'n'}, `${V.idx+1} / ${l.slides.length}`),
    h('button', {class:'btn icon', 'aria-label':'Próximo slide', disabled: V.idx >= l.slides.length-1, onclick:()=>{V.idx++; renderView();}}, icon('right')),
    h('span', {class:'ty'}, SP.TYPE_NAMES[s.type] || '')
  ));
  if (V.editing && ready){
    stage.append(h('div', {class:'panel', style:'margin-top:14px'}, h('h4', {}, 'Notas do professor deste slide'),
      h('textarea', {class:'notes', id:'nota-' + V.idx, placeholder:'Escreva orientações para você ver durante a apresentação. Elas também vão para as anotações do PowerPoint.', oninput:(e)=>{ const L2 = editable(id); L2.slides[V.idx].nota = e.target.value; persist(id, L2); }}, s.nota || '')));
  }
  main.append(stage);

  const side = h('aside', {class:'side'});
  if (!ready){
    side.append(h('div', {class:'panel'}, h('h4', {}, 'Esta aula está em produção'), h('p', {}, `Ela chega no lote ${LOTE[id]}, com o mesmo padrão das aulas prontas: 19 a 20 slides, PowerPoint editável, PDF e folha de atividades.`)));
  } else {
    side.append(h('div', {class:'panel'}, h('h4', {}, 'Como usar'), h('p', {}, `${l.slides.length} slides para cerca de 2 aulas de 50 minutos. Em "Apresentar", clique nas alternativas do quiz para revelar a resposta e use o botão "Respostas" nas atividades.`)));
  }
  side.append(h('div', {class:'panel'}, h('h4', {}, 'Habilidades da BNCC'), m.codes.map(c => h('div', {class:'bncc-item'}, h('b', {}, c), h('p', {}, (window.BNCC||{})[c] || '')))));
  main.append(side);
  view.append(main);

  const below = h('div', {class:'wrap'});
  if (ready){
    below.append(h('div', {class:'section-h', style:'margin-bottom:12px'}, h('h2', {}, 'Todos os slides'), h('span', {class:'codes'}, isEdited(id) ? 'Versão editada por você' : 'Versão original')));
    below.append(h('div', {class:'thumbs'}, l.slides.map((sl, k) => h('button', {class:'thumb', 'aria-current':String(k===V.idx), onclick:()=>{V.idx = k; renderView(); view.scrollTo({top:0, behavior:'smooth'});}}, frame(m, l, k, {lazy:true}), h('span', {}, `${String(k+1).padStart(2,'0')} · ${SP.TYPE_NAMES[sl.type]||''}`)))));
  } else {
    below.append(h('div', {class:'panel', style:'margin-bottom:48px'}, h('h4', {}, 'Estrutura planejada da aula'), h('ol', {class:'plan'}, PLANO.map(p => h('li', {}, p)))));
  }
  view.append(below);
}

// ---------- edição ----------
function editable(id){ return store.get(id) || clone(AULAS[id]); }
function persist(id, data){ if (!store.set(id, data)) toast('Não há espaço neste navegador para salvar a edição. Tente uma foto menor.'); }
function wireEditing(fr, id){
  fr.addEventListener('focusout', (e) => {
    const el = e.target.closest('[data-edit]'); if (!el || el.tagName === 'IMG') return;
    const L2 = editable(id); const s = L2.slides[V.idx];
    const val = SP.fromHTML(el);
    if (SP.getPath(s, el.dataset.edit) === val) return;
    SP.setPath(s, el.dataset.edit, val); persist(id, L2);
    SP.shrink(fr.querySelector('.sl'));
    refreshThumbs(id);
  });
  fr.addEventListener('keydown', (e) => { if (e.key === 'Escape') e.target.blur(); e.stopPropagation(); });
  fr.addEventListener('click', (e) => { if (e.target.tagName === 'IMG' && e.target.dataset.edit) pickImage(id); });
}
function refreshThumbs(id){
  const m = META[id], l = lessonOf(id);
  document.querySelectorAll('.thumbs .thumb').forEach((t,k) => { const old = t.querySelector('.frame'); if (old && l.slides[k]) old.replaceWith(frame(m, l, k)); });
  const sub = document.querySelector('.view .section-h .codes'); if (sub) sub.textContent = 'Versão editada por você';
}
let confirmDel = false, confirmReset = false;
function editBar(id, l){
  const s = l.slides[V.idx]; const hasImg = SP.layout(META[id], l, V.idx).some(e => e.k === 'img');
  const act = (fn) => () => { const L2 = editable(id); fn(L2); persist(id, L2); renderView(); };
  return h('div', {class:'editbar'},
    h('span', {class:'lbl'}, 'Modo edição:'), h('span', {}, 'clique em qualquer texto para alterar.'),
    hasImg ? h('button', {class:'btn sm', onclick:()=>pickImage(id)}, 'Trocar imagem') : null,
    h('button', {class:'btn sm', onclick:act(L2 => { L2.slides.splice(V.idx+1, 0, clone(L2.slides[V.idx])); V.idx++; })}, 'Duplicar slide'),
    h('button', {class:'btn sm', disabled: V.idx === 0, onclick:act(L2 => { const [x] = L2.slides.splice(V.idx,1); L2.slides.splice(V.idx-1,0,x); V.idx--; })}, 'Mover para trás'),
    h('button', {class:'btn sm', disabled: V.idx >= l.slides.length-1, onclick:act(L2 => { const [x] = L2.slides.splice(V.idx,1); L2.slides.splice(V.idx+1,0,x); V.idx++; })}, 'Mover para frente'),
    h('button', {class:'btn sm', disabled: l.slides.length <= 1, onclick:(e)=>{ if (!confirmDel){ confirmDel = true; e.target.textContent = 'Confirmar exclusão'; setTimeout(()=>{confirmDel=false; if (e.target.isConnected) e.target.textContent='Excluir slide';}, 3500); return; } confirmDel = false; act(L2 => { L2.slides.splice(V.idx,1); V.idx = Math.max(0, V.idx-1); })(); }}, 'Excluir slide'),
    isEdited(id) ? h('button', {class:'btn sm', onclick:(e)=>{ if (!confirmReset){ confirmReset = true; e.target.textContent = 'Confirmar: voltar ao original'; setTimeout(()=>{confirmReset=false; if (e.target.isConnected) e.target.textContent='Restaurar original';}, 3500); return; } confirmReset = false; store.del(id); toast('Aula restaurada para a versão original.'); renderView(); }}, 'Restaurar original') : null
  );
}
function pickImage(id){
  const close = () => modal.remove();
  const setImg = (fn) => { const L2 = editable(id); fn(L2.slides[V.idx]); persist(id, L2); close(); renderView(); };
  const file = h('input', {type:'file', accept:'image/*', hidden:true, onchange: async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
      const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 900, sc = Math.min(1, max/Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      setImg(s => { s.photo = c.toDataURL('image/jpeg', 0.82); });
    } catch(_) { toast('Não foi possível abrir essa imagem. Use um arquivo JPG ou PNG.'); }
  }});
  const s = lessonOf(id).slides[V.idx];
  const modal = h('div', {class:'modal', onclick:(e)=>{ if (e.target === modal) close(); }},
    h('div', {class:'box', role:'dialog', 'aria-label':'Trocar imagem'},
      h('h3', {}, 'Trocar imagem do slide'),
      h('p', {style:'color:var(--muted);margin:0'}, 'Envie uma foto do seu computador ou celular, ou escolha uma das ilustrações da plataforma.'),
      h('div', {style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:12px'},
        h('button', {class:'btn mark', onclick:()=>file.click()}, 'Enviar foto'), file,
        s.photo ? h('button', {class:'btn', onclick:()=>setImg(x => { delete x.photo; })}, 'Remover foto') : null,
        h('button', {class:'btn', onclick:close}, 'Cancelar')),
      h('div', {class:'ill-grid'}, Object.entries(window.ILUSTRACAO_NOMES).map(([k,n]) => h('button', {onclick:()=>setImg(x => { delete x.photo; x.ill = k; })}, h('img', {src:SP.illURL(k), alt:''}), n)))
    ));
  document.body.append(modal);
}

// ---------- apresentação ----------
let P = null;
function present(id, idx=0){
  const m = META[id], l = lessonOf(id);
  P = {id, idx, answers:false, notes:false};
  const el = h('div', {class:'present', id:'present', role:'dialog', 'aria-label':'Apresentação'});
  document.body.append(el);
  const draw = () => {
    el.innerHTML = '';
    const s = l.slides[P.idx];
    const fr = frame(m, l, P.idx, {answers:P.answers});
    const st = h('div', {class:'pstage'}, fr);
    fr.addEventListener('click', (e) => {
      const opt = e.target.closest('.sl-opt') || [...fr.querySelectorAll('.sl-opt')].find(o => { const r = o.getBoundingClientRect(); return e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom; });
      if (!opt || s.type !== 'quiz' || fr.dataset.done) return;
      const k = +opt.dataset.opt; fr.dataset.done = '1';
      fr.querySelectorAll('.sl-opt').forEach(o => { if (+o.dataset.opt === s.c) o.classList.add('right'); else if (o === opt) o.classList.add('wrong'); });
      const sl = fr.querySelector('.sl'); sl.append(h('div', {class:'why'}, (k === s.c ? 'Correto! ' : `Resposta: ${'ABCD'[s.c]}. `) + SP.plain(s.why || '')));
    });
    const prog = h('div', {class:'prog'}, h('i')); prog.firstChild.style.width = ((P.idx+1)/l.slides.length*100) + '%';
    const bar = h('div', {class:'pbar'},
      h('button', {class:'btn icon', 'aria-label':'Sair da apresentação', title:'Sair (Esc)', onclick:exit}, icon('x')),
      h('button', {class:'btn icon', 'aria-label':'Slide anterior', onclick:()=>go(-1)}, icon('left')),
      h('span', {class:'n'}, `${P.idx+1} / ${l.slides.length}`),
      h('button', {class:'btn icon', 'aria-label':'Próximo slide', onclick:()=>go(1)}, icon('right')),
      prog,
      h('button', {class:'btn sm', 'aria-pressed':String(P.answers), onclick:()=>{P.answers=!P.answers; draw();}}, 'Respostas'),
      h('button', {class:'btn sm', 'aria-pressed':String(P.notes), onclick:()=>{P.notes=!P.notes; draw();}}, 'Notas'),
      h('button', {class:'btn icon', 'aria-label':'Tela cheia', title:'Tela cheia', onclick:()=>{ try { document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen().catch(()=>{}); } catch(_) {} }}, icon('full'))
    );
    el.append(st);
    if (P.notes){
      const n = [s.nota && SP.plain(s.nota), s.type === 'quiz' && `Resposta: ${'ABCD'[s.c]}) ${SP.plain(s.opts[s.c])}. ${SP.plain(s.why||'')}`, s.type === 'atividade' && 'Respostas: ' + s.items.map((it,k)=>`${k+1}) ${SP.plain(it.r)}`).join('   ')].filter(Boolean);
      el.append(h('div', {class:'pnotes'}, n.length ? n.join('\n') : 'Sem notas para este slide.'));
    }
    el.append(bar);
  };
  const go = (d) => { const n = P.idx + d; if (n < 0 || n >= l.slides.length) return; P.idx = n; draw(); };
  const key = (e) => { if (['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); } else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); } else if (e.key === 'Escape' && !document.fullscreenElement){ e.stopPropagation(); exit(); } e.stopPropagation(); };
  function exit(){ document.removeEventListener('keydown', key); try { if (document.fullscreenElement) document.exitFullscreen(); } catch(_) {} el.remove(); if (V){ V.idx = P.idx; renderView(); } P = null; }
  document.addEventListener('keydown', key);
  draw();
}

// ---------- início ----------
renderShell();
const fromHash = () => { const mh = /^#aula-(\d+)$/.exec(location.hash||''); if (mh && META[+mh[1]]){ if (!V || V.id !== +mh[1]) openView(+mh[1]); } else if (V && !location.hash) closeView(); };
fromHash(); window.addEventListener('hashchange', fromHash);
window.addEventListener('keydown', (e) => { if (!P && V && !V.editing && !e.target.closest('input,textarea,[contenteditable="true"]')){ const l = lessonOf(V.id) || placeholder(V.id); if (e.key === 'ArrowRight' && V.idx < l.slides.length-1){ V.idx++; renderView(); } if (e.key === 'ArrowLeft' && V.idx > 0){ V.idx--; renderView(); } if (e.key === 'Escape') closeView(); } });
})();

</script>
